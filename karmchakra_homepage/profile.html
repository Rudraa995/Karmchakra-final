<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | KarmaChakra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body class="pf-body">

    <!-- NAVBAR (same as home page) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top kc-navbar">
        <div class="container kc-container">
            <a class="navbar-brand kc-brand" href="index.html">
                <span class="brand-mark">
          <svg class="brand-symbol" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1" />
            <circle cx="20" cy="20" r="12.5" stroke="currentColor" stroke-width="1" />
            <path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.5 8.5l4.2 4.2M27.3 27.3l4.2 4.2M31.5 8.5l-4.2 4.2M12.7 27.3l-4.2 4.2" stroke="currentColor" stroke-width="1" />
            <circle cx="20" cy="20" r="4" fill="currentColor" />
          </svg>
        </span>
                <span>KarmChakra</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
            <div class="collapse navbar-collapse" id="mainNav">

                <ul class="navbar-nav ms-auto align-items-lg-center kc-nav-links">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#karmas">Karmas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="karmguru.html">KarmGuru</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">Profile</a>
                    </li>

                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn kc-join-btn" href="login.html">Join</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <main class="pf">

        <!-- ===== HEADER CARD ===== -->
        <section class="pf-hero">
            <div class="pf-avatar-wrap">
                <svg class="pf-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" class="ring-bg"/>
          <circle cx="60" cy="60" r="54" class="ring-fill" id="ringFill"/>
        </svg>
                <div class="pf-avatar" id="avatar"><span id="avatarInitial">K</span></div>
                <label class="pf-cam" title="Change photo">
          <input type="file" id="photoInput" accept="image/*" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </label>
            </div>

            <div class="pf-id">
                <h1 id="pName">Your Name</h1>
                <p class="pf-level" id="pLevel">Karma Yogi, Level 7</p>
                <p class="pf-bio" id="pBio">Add a short line about yourself.</p>
                <div class="pf-actions">
                    <button type="button" class="pf-btn" id="editBtn">Edit profile</button>
                    <button type="button" class="pf-btn ghost" id="logoutBtn">Logout</button>
                </div>
            </div>

            <div class="pf-mudra">
                <span class="label">Karma Mudrā</span>
                <strong id="mudraTotal">0</strong>
                <div class="bar"><i id="levelBar"></i></div>
                <small id="levelNote"></small>
            </div>
        </section>

        <!-- ===== STATS ===== -->
        <section class="pf-stats">
            <div><strong data-stat="verified">0</strong><span>Karmas verified</span></div>
            <div><strong data-stat="streak">0</strong><span>Day streak</span></div>
            <div><strong data-stat="badges">0</strong><span>Badges earned</span></div>
            <div><strong data-stat="rank">#0</strong><span>Leaderboard rank</span></div>
        </section>

        <!-- ===== DOMAINS + ACTIVITY ===== -->
        <section class="pf-grid">
            <div class="pf-card">
                <h2>Your six karmas</h2>
                <div id="domains"></div>
            </div>
            <div class="pf-card">
                <h2>Recent activity</h2>
                <ul class="pf-activity" id="activity"></ul>
            </div>
        </section>

        <!-- ===== BADGES ===== -->
        <section class="pf-card">
            <h2>Badges</h2>
            <div class="pf-badges" id="badges"></div>
        </section>

        <p class="pf-note" id="toast" role="status" hidden></p>
    </main>

    <!-- ===== EDIT PROFILE POPUP ===== -->
    <dialog id="editDialog" class="pf-dialog">
        <form id="editForm" novalidate>
            <h2>Edit profile</h2>

            <div class="field">
                <label for="fName">Full name</label>
                <input type="text" id="fName" autocomplete="name">
                <small class="error"></small>
            </div>
            <div class="field">
                <label for="fEmail">Email</label>
                <input type="email" id="fEmail" autocomplete="email">
                <small class="error"></small>
            </div>
            <div class="field">
                <label for="fPhone">Mobile number</label>
                <input type="tel" id="fPhone" inputmode="numeric" maxlength="10" autocomplete="tel">
                <small class="error"></small>
            </div>
            <div class="field">
                <label for="fBio">About you <span id="bioCount">0/120</span></label>
                <textarea id="fBio" rows="3" maxlength="120"></textarea>
            </div>

            <div class="dialog-actions">
                <button type="button" class="pf-btn ghost" id="cancelBtn">Cancel</button>
                <button type="submit" class="pf-btn">Save changes</button>
            </div>
        </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="profile.js"></script>
</body>

</html>
