        <div class="container kc-container">
            <a class="navbar-brand kc-brand" href="index.html">
                <svg class="brand-symbol" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1"/>
          <circle cx="20" cy="20" r="12.5" stroke="currentColor" stroke-width="1"/>
          <path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.5 8.5l4.2 4.2M27.3 27.3l4.2 4.2M31.5 8.5l-4.2 4.2M12.7 27.3l-4.2 4.2" stroke="currentColor" stroke-width="1"/>
          <circle cx="20" cy="20" r="4" fill="currentColor"/>
        </svg>
                <span>KarmChakra</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center kc-nav-links">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html#karmas">Karmas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="karmguru.html">KarmGuru</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>

                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn kc-join-btn" href="login.html">Join</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Mobile sidebar toggle -->
    <button class="seva-mobile-menu-btn" id="sevaMobileMenu">☰</button>

    <!-- Sidebar (same as seva.html) -->
    <aside class="seva-sidebar" id="sevaSidebar">
        <div class="seva-sidebar-header">
            <div class="seva-sidebar-title">Seva</div>
            <div class="seva-sidebar-subtitle">Karma Dashboard</div>
        </div>

        <div class="seva-sidebar-nav">
            <a class="seva-sidebar-item" data-activity="feed-hungry" href="seva-activity.html?activity=feed-hungry">
                <span class="seva-sidebar-icon">🍲</span>
                <span>Feed the Hungry</span>
            </a>

            <a class="seva-sidebar-item" data-activity="donate-essentials" href="seva-activity.html?activity=donate-essentials">
                <span class="seva-sidebar-icon">👕</span>
                <span>Donate Essentials</span>
            </a>

            <a class="seva-sidebar-item" data-activity="elderly-care" href="seva-activity.html?activity=elderly-care">
                <span class="seva-sidebar-icon">👵</span>
                <span>Elderly Care Visit</span>
            </a>

            <a class="seva-sidebar-item" data-activity="teach-support" href="seva-activity.html?activity=teach-support">
                <span class="seva-sidebar-icon">📚</span>
                <span>Community Teaching</span>
            </a>
        </div>

        <div class="seva-sidebar-bottom">
            <div class="seva-karma-score">
                <div class="seva-karma-score-title">Karma Score</div>
                <div class="seva-karma-score-number">1,240<span>pts</span></div>
                <div class="seva-karma-progress">
                    <div class="seva-karma-progress-fill"></div>
                </div>
                <div class="seva-karma-level">Level 7 · Seva Sevak</div>
            </div>
        </div>
    </aside>

    <div class="seva-sidebar-overlay" id="sevaSidebarOverlay"></div>

    <!-- Dynamic Seva Activity Page (filled by initSevaActivityPage in script.js) -->
    <main id="sevaActivityPage" class="seva-main-content" data-seva-activity-page></main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <script>
        // Highlight the sidebar item matching the current activity
        const currentActivity = new URLSearchParams(window.location.search).get('activity');
        document.querySelectorAll('.seva-sidebar-item').forEach(item => {
            if (item.dataset.activity === currentActivity) {
                item.classList.add('active');
            }
        });

        const mobileBtn = document.getElementById('sevaMobileMenu');
        const sidebarEl = document.getElementById('sevaSidebar');
        const overlayEl = document.getElementById('sevaSidebarOverlay');

        mobileBtn.addEventListener('click', () => {
            sidebarEl.classList.toggle('open');
            overlayEl.classList.toggle('active');
        });
        overlayEl.addEventListener('click', () => {
            sidebarEl.classList.remove('open');
            overlayEl.classList.remove('active');
        });
    </script>
</body>

</html>
